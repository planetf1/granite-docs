name: Docs

# Builds, validates, and deploys Docusaurus documentation to GitHub Pages.
# Fork → https://<user>.github.io/docs/ (baseUrl: /docs/)
# Upstream (ibm-granite/docs) → https://ibm-granite.github.io/docs/ (baseUrl: /docs/)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCS_BASE_URL: "/docs/"

jobs:
  # ---------------------------------------------------------------------------
  # Build & Validate
  # ---------------------------------------------------------------------------
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        id: build_site
        run: npm run build
        env:
          DOCS_BASE_URL: ${{ env.DOCS_BASE_URL }}

      - name: Lint markdown (markdownlint)
        id: markdownlint
        run: |
          npx --yes markdownlint-cli2 "granite/docs/**/*.mdx" "granite/docs/**/*.md" \
            --config granite/docs/.markdownlint.json 2>&1 || true
        continue-on-error: true

      - name: Spell check (codespell)
        id: codespell
        run: |
          pip install codespell --quiet
          codespell granite/docs \
            --skip="*.json,package-lock.json" \
            --quiet-level=2 || true
        continue-on-error: true

      - name: Upload built site artifact
        if: success()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: docs-site
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # External link check (scheduled + manual, not on every PR)
  # ---------------------------------------------------------------------------
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check external links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --accept 200,206,429
            --exclude-path granite/docs/resources
            --exclude "https://www.ibm.com"
            --exclude "https://www.ibm.com/granite"
            --timeout 20
            granite/docs
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Deploy to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b82a6e03acdef07 # v4.1.8
        with:
          name: docs-site
          path: docs-site/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs-site/
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: |
            docs: publish from ${{ github.sha }}

            Trigger: ${{ github.event_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Write deploy summary
        if: always()
        run: |
          echo "## Docs Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`gh-pages\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`${GITHUB_SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Base URL | \`$DOCS_BASE_URL\` |" >> $GITHUB_STEP_SUMMARY
